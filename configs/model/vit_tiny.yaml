# @package model
# CPU smoke model. Tests and scripts/pretrain_depth.py use this. It is not a
# training recipe for the laptop GPU; see vit_small and vit_base for that.
name: vit_tiny
pretrained: null
pretrained_allow_download: false
img_size: 32
patch_size: 8
embed_dim: 32
depth: 2
num_heads: 4
mlp_ratio: 2.0
out_indices: [1]
cross_view_layers: 1
pose_encoding: plucker
pose_zero_init: false
num_frequencies: 4
normalize: none
gradient_checkpointing: false
init_values: 1.0
depth_planes: 8
depth_near: 0.4
depth_far: 12.0
depth_spacing: linear
lift_stride: 4
temperature: 0.02
# Tests and CPU smoke. Not the laptop training recipe.
splats:
  slots_per_cell: 4
  max_extra_gaussians: 256
  edge_threshold: 0.4
  min_scale_m: 1.0e-4
  max_scale_m: 2.0
  wire_transverse_max_m: 0.03
  wire_long_max_m: 1.0
  base_scale_m: 0.2
  extra_thin_scale_m: 0.01
  extra_long_scale_m: 0.25
  opacity_init: 0.1
  note: >
    Unit-test width. Laptop training is vit_small on 8 GB or vit_base on
    16 GB, batch size 1, four cameras, 224 px. This file's slot cap is only
    so the CPU smoke model stays small.
memory:
  min_vram_gb: 8
  max_vram_gb: 16
  recommended_resolution: 32
  batch_size: 1
  cameras: 4
  note: >
    Unit-test width only. On an 8–16 GB laptop GPU train with vit_small (8 GB
    at 224px) or vit_base (16 GB at 224px), batch size 1, four cameras.
