# @package model
# ViT-L/16, the width of DUSt3R and MASt3R (and the AerialMegaDepth aerial
# checkpoints of those models). This does not fit an 8–16 GB laptop GPU as an
# unfrozen 4-camera trainer. It exists so a local checkpoint can be loaded and
# inspected, or frozen at a very small resolution.
name: vit_large
pretrained: null
pretrained_allow_download: false
img_size: 224
patch_size: 16
embed_dim: 1024
depth: 24
num_heads: 16
mlp_ratio: 4.0
out_indices: [7, 15, 23]
cross_view_layers: 2
pose_encoding: plucker+sinusoidal
pose_zero_init: true
num_frequencies: 6
normalize: imagenet
gradient_checkpointing: true
init_values: 1.0
depth_planes: 16
depth_near: 0.5
depth_far: 80.0
depth_spacing: inverse
lift_stride: 16
temperature: 0.02
splats:
  slots_per_cell: 4
  max_extra_gaussians: 1024
  edge_threshold: 0.4
  min_scale_m: 1.0e-4
  max_scale_m: 2.0
  wire_transverse_max_m: 0.03
  wire_long_max_m: 1.0
  note: >
    The splat budget matches the 8–16 GB laptop recipes. ViT-L itself does
    not fit that budget unfrozen at 4 cameras. N at 224 px, stride 16, 4
    cameras, 4 slots is 4 * 14 * 14 * 4 = 3136.
memory:
  min_vram_gb: 8
  max_vram_gb: 16
  recommended_resolution: 224
  batch_size: 1
  cameras: 4
  note: >
    Above the 8–16 GB laptop budget for unfrozen 4-camera training. Load an
    aerial DUSt3R or MASt3R checkpoint here only to map keys, or freeze the
    encoder. Train vit_small on 8 GB and vit_base on 16 GB.
