# @package model
# DINOv2 ViT-S/14 width. This is the 8 GB laptop setting.
name: vit_small
# Local DINOv2 checkpoint, or dinov2_vits14 with pretrained_allow_download: true.
# An aerial DUSt3R / MASt3R checkpoint is ViT-L and does not match this width;
# use vit_large for that file, and only if the GPU can hold it.
pretrained: null
pretrained_allow_download: false
img_size: 224
patch_size: 14
embed_dim: 384
depth: 12
num_heads: 6
mlp_ratio: 4.0
out_indices: [3, 7, 11]
cross_view_layers: 2
pose_encoding: plucker+sinusoidal
# Zero-init so a loaded DINOv2 encoder is unchanged until the pose layers train.
pose_zero_init: true
num_frequencies: 6
normalize: imagenet
gradient_checkpointing: true
init_values: 1.0
depth_planes: 32
depth_near: 0.5
depth_far: 80.0
depth_spacing: inverse
lift_stride: 14
temperature: 0.02
# Static slot budget. N = cameras * (img/stride)^2 * slots_per_cell.
# At 224 px, stride 14, 4 cameras, 4 slots: N = 4096. That tensor is about a
# megabyte. The ViT, not the splat tensor, is the 8 GB limit. max_extra_gaussians
# only clears the valid mask; it does not change N.
splats:
  slots_per_cell: 4
  max_extra_gaussians: 1024
  edge_threshold: 0.4
  offset_radius_m: 0.5
  along_radius_m: 0.4
  min_scale_m: 1.0e-4
  max_scale_m: 2.0
  wire_transverse_max_m: 0.03
  wire_long_max_m: 1.0
  base_scale_m: 0.2
  extra_thin_scale_m: 0.01
  extra_long_scale_m: 0.25
  opacity_init: 0.1
  note: >
    8 GB laptop (ViT-S, 224 px, batch 1, 4 cameras): keep slots_per_cell at 4.
    16 GB (ViT-B) uses the same splat budget; the extra memory is the backbone.
    Do not raise the slot count to chase wires until the ViT fits. The CPU
    reference renderer is O(N*H*W) and is not the 1080p path.
memory:
  min_vram_gb: 8
  max_vram_gb: 16
  recommended_resolution: 224
  batch_size: 1
  cameras: 4
  note: >
    MSI Vector 17 HX class laptop, 8–16 GB NVIDIA VRAM. ViT-S/14, 4 cameras,
    224px, 32 depth planes, batch 1, gradient checkpointing is the 8 GB target.
    336px fits more comfortably at 12–16 GB. Do not train this model at 1080p;
    the benchmark script measures the simulator at 1080p, not the network.
    518px (the DINOv2 native grid) needs the 16 GB card and still wants batch 1.
