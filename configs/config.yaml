defaults:
  - data: fixture
  - rig: uam_quad
  - model: vit_small
  - pretrain: depth
  - train: phase4
  - _self_

seed: 0
project: aerosplat

# Disk cache for occupancy grids consumed by the Phase 5 occupancy head.
cache:
  root: outputs/cache
  voxel_size: 0.5
  extent_m: 12.0
  max_depth: 40.0
  min_depth: 0.05
  stride: 1
  # Segmentation labels or RGB colors that mean "cable". Empty skips the
  # wire class. The fine grid is ground truth only; the network stays coarse.
  wire_ids: []
  wire_colors: []
  wire_voxel_size: 0.02
  wire_extent_m: 4.0
