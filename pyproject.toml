[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aerosplat"
version = "0.5.0"
description = "Feedforward 4D Gaussian splatting for Urban Air Mobility"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["gaussian-splatting", "uav", "urban-air-mobility", "pytorch"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "omegaconf>=2.3",
    "hydra-core>=1.3",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "matplotlib>=3.8",
    "onnx>=1.16",
    "onnxruntime>=1.18",
]
# Phase 4 binds a CUDA rasterizer (diff-gaussian-rasterization or a maintained
# alternative such as gsplat). That build is intentionally not an install extra:
# CI is CPU-only and must not compile CUDA extensions.

[project.scripts]
aerosplat-fixture = "aerosplat.data.fixture:main"
aerosplat-sanity = "aerosplat.vis.alignment:main"
aerosplat-cache = "aerosplat.data.cli:main"
aerosplat-capture = "aerosplat.capture.colosseum:main"
aerosplat-pretrain = "aerosplat.models.pretrain:main"
aerosplat-train = "aerosplat.train:main"
aerosplat-benchmark = "aerosplat.capture.benchmark:main"
aerosplat-synthetic = "aerosplat.synth.batch:main"
aerosplat-export = "aerosplat.export:main"

[tool.setuptools.packages.find]
include = ["aerosplat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["aerosplat"]
