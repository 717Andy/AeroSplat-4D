# Workbench defaults. The demo episode is generated by `python -m server.demo`.
# A training checkpoint is optional. When it is missing or does not match
# `model_name`, the API serves a random-init model of that config.
checkpoint: null
model_name: vit_tiny
device: auto
episode_dirs:
  - episodes/demo
grid_size: [32, 32, 20]
voxel_size: 0.5
occ_origin: [-2.0, -6.0, -1.0]
host: 127.0.0.1
port: 8000
